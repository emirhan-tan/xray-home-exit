<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <title>Nasıl çalışır · How it works</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="context-stroke"/>
    </marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#78ffb4"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5b6573"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ffb86b"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .t{font-size:15px;fill:#e8ecf1;font-weight:600}
    .s{font-size:12px;fill:#6b7684}
    .k{font-size:11px;letter-spacing:1.5px}
    .node{fill:#12161b;stroke:#2a323c;stroke-width:1.5}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .tunnel{stroke-dasharray:10 4;animation:flow 1.1s linear infinite}
    .fb{stroke-dasharray:6 5}
  </style>

  <rect x=".5" y=".5" width="1199" height="579" rx="20" fill="#0d1116" stroke="#1f252d"/>
  <rect x="1" y="1" width="1198" height="578" rx="20" fill="url(#grid)" opacity=".6"/>
  <rect x="56" y="0" width="72" height="3" rx="1.5" fill="#78ffb4"/>
  <text x="56" y="46" class="mono k" fill="#6b7684">NASIL ÇALIŞIR · HOW IT WORKS</text>

  <!-- ===== kaynaklar ===== -->
  <g class="sans">
    <rect x="40" y="96" width="250" height="66" rx="12" class="node" stroke="#78ffb4" stroke-opacity=".55"/>
    <circle cx="64" cy="129" r="5" fill="#78ffb4"/>
    <text x="80" y="124" class="t">Seçili kullanıcılar</text>
    <text x="80" y="143" class="s">Selected users · --users</text>

    <rect x="40" y="206" width="250" height="66" rx="12" class="node"/>
    <circle cx="64" cy="239" r="5" fill="#5b6573"/>
    <text x="80" y="234" class="t">Diğer kullanıcılar</text>
    <text x="80" y="253" class="s">Other users (unchanged)</text>

    <rect x="40" y="316" width="250" height="66" rx="12" class="node" stroke="#78ffb4" stroke-opacity=".55"/>
    <circle cx="64" cy="349" r="5" fill="#78ffb4"/>
    <text x="80" y="344" class="t">Sunucudaki uygulamalar</text>
    <text x="80" y="363" class="s mono">bots · curl → 127.0.0.1:1080</text>
  </g>

  <!-- ===== VPS ===== -->
  <rect x="350" y="70" width="470" height="350" rx="16" fill="#b69cff" fill-opacity=".03" stroke="#b69cff" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="372" y="98" class="mono" font-size="13" font-weight="700" fill="#b69cff">VPS</text>
  <text x="408" y="98" class="sans s">Xray · x-ui / 3x-ui / standalone</text>

  <g class="sans">
    <rect x="380" y="190" width="170" height="66" rx="12" class="node"/>
    <text x="465" y="218" class="t" text-anchor="middle">Yönlendirme</text>
    <text x="465" y="237" class="s" text-anchor="middle">Routing</text>

    <rect x="610" y="112" width="186" height="66" rx="12" class="node" stroke="#78ffb4" stroke-opacity=".55"/>
    <text x="703" y="140" class="t" text-anchor="middle">Yedekli seçici</text>
    <text x="703" y="159" class="s" text-anchor="middle">Balancer · health-check 10 s</text>

    <rect x="610" y="212" width="186" height="66" rx="12" class="node" stroke="#78ffb4"/>
    <text x="703" y="240" class="t" text-anchor="middle">Portal</text>
    <text x="703" y="259" class="s mono" text-anchor="middle">VLESS Reverse</text>

    <rect x="610" y="318" width="186" height="66" rx="12" class="node"/>
    <text x="703" y="346" class="t mono" text-anchor="middle">direct</text>
    <text x="703" y="365" class="s" text-anchor="middle">sunucu IP · VPS IP</text>
  </g>

  <!-- kaynak → yönlendirme -->
  <g fill="none" stroke-width="2">
    <path d="M290 129C335 129 335 205 376 210" stroke="#78ffb4" marker-end="url(#ahm)"/>
    <path d="M290 239C330 239 340 228 376 226" stroke="#5b6573" marker-end="url(#ahg)"/>
    <path d="M290 349C335 349 335 248 376 242" stroke="#78ffb4" marker-end="url(#ahm)"/>
  </g>
  <!-- yönlendirme → balancer / direct -->
  <g fill="none" stroke-width="2">
    <path d="M550 212C580 212 575 145 606 145" stroke="#78ffb4" marker-end="url(#ahm)"/>
    <path d="M550 234C585 234 575 351 606 351" stroke="#5b6573" marker-end="url(#ahg)"/>
  </g>
  <!-- balancer → portal (tünel varken) -->
  <path d="M703 178V208" fill="none" stroke="#78ffb4" stroke-width="2" marker-end="url(#ahm)"/>
  <g class="sans" font-size="11" fill="#78ffb4" text-anchor="end"><text x="696" y="193">ev bağlıysa</text><text x="696" y="206" fill="#6b7684">if home is up</text></g>
  <!-- balancer → direct (yedek) -->
  <path d="M796 150C814 150 814 351 800 351" fill="none" stroke="#ffb86b" stroke-width="2" class="fb" marker-end="url(#aho)"/>
  <g class="sans" font-size="11" fill="#ffb86b">
    <text x="830" y="374">ev yoksa ~10 sn'de</text>
    <text x="830" y="389" fill="#6b7684">else within ~10 s</text>
  </g>

  <!-- ===== ev cihazı ===== -->
  <g class="sans">
    <rect x="910" y="190" width="250" height="78" rx="14" fill="#12161b" stroke="#78ffb4" stroke-width="2"/>
    <path d="M934 232 950 218 966 232" fill="none" stroke="#78ffb4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="938" y="230" width="24" height="18" rx="2" fill="none" stroke="#78ffb4" stroke-width="2"/>
    <text x="980" y="224" class="t">Ev cihazı · Home</text>
    <text x="980" y="243" class="s">OpenWrt · Pi · Linux · Windows</text>
    <text x="980" y="259" class="s">CGNAT · dinamik IP olur</text>
  </g>

  <!-- kalıcı tünel: bağlantı evden açılır (←), trafik sunucudan eve akar (→) -->
  <path d="M796 245H906" fill="none" stroke="#78ffb4" stroke-opacity=".16" stroke-width="12" stroke-linecap="round"/>
  <path d="M796 245H906" fill="none" stroke="#78ffb4" stroke-width="2" class="tunnel"/>
  <circle r="4" fill="#78ffb4"><animateMotion dur="1.3s" repeatCount="indefinite" path="M800 245H904"/></circle>
  <circle r="4" fill="#78ffb4" opacity=".55"><animateMotion dur="1.3s" begin=".65s" repeatCount="indefinite" path="M800 245H904"/></circle>
  <g class="sans" font-size="11" fill="#78ffb4">
    <path d="M904 290H826" fill="none" stroke="#78ffb4" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#ahm)"/>
    <text x="866" y="309" text-anchor="middle">bağlantıyı ev açar</text>
    <text x="866" y="324" text-anchor="middle" fill="#6b7684">dialed from home</text>
  </g>

  <!-- ===== internet ===== -->
  <g fill="none" stroke-width="2">
    <path d="M703 384V462" stroke="#5b6573" marker-end="url(#ahg)"/>
    <path d="M1035 268V462" stroke="#78ffb4" marker-end="url(#ahm)"/>
  </g>
  <circle r="3.5" fill="#78ffb4"><animateMotion dur="1.5s" repeatCount="indefinite" path="M1035 272V458"/></circle>

  <g class="sans">
    <rect x="590" y="468" width="226" height="70" rx="14" fill="#12161b" stroke="#2a323c" stroke-width="1.5"/>
    <g fill="none" stroke="#5b6573" stroke-width="1.8"><circle cx="622" cy="503" r="15"/><ellipse cx="622" cy="503" rx="6.5" ry="15"/><path d="M607 503H637"/></g>
    <text x="648" y="498" class="t">İnternet</text>
    <text x="648" y="517" class="s">sunucu IP'si · VPS IP</text>

    <rect x="922" y="468" width="226" height="70" rx="14" fill="#12161b" stroke="#ffb86b" stroke-width="1.5"/>
    <g fill="none" stroke="#ffb86b" stroke-width="1.8"><circle cx="954" cy="503" r="15"/><ellipse cx="954" cy="503" rx="6.5" ry="15"/><path d="M939 503H969"/></g>
    <text x="980" y="498" class="t">İnternet</text>
    <text x="980" y="517" class="s">ev IP'si · home IP</text>
  </g>
</svg>
