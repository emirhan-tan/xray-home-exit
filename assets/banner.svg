<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <title>xray-home-exit — Sunucuna bağlan, ev internetinden çık · Connect to your VPS, exit through your home internet</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78ffb4" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#0d1116" stop-opacity="0"/>
      <stop offset="1" stop-color="#b69cff" stop-opacity=".07"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f252d" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset=".55" stop-color="#0d1116" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0d1116" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes flow{to{stroke-dashoffset:-28}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .in{animation:rise .7s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
    .tunnel{stroke-dasharray:10 4;animation:flow 1.1s linear infinite}
    .led{animation:pulse 1.6s ease-in-out infinite}
  </style>

  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="#0d1116" stroke="#1f252d"/>
  <rect x="640" y="1" width="559" height="338" fill="url(#grid)" opacity=".55"/>
  <rect x="640" y="1" width="300" height="338" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="url(#bg)"/>
  <rect x="56" y="0" width="72" height="3" rx="1.5" fill="#78ffb4"/>

  <!-- sol: başlık -->
  <g class="in">
    <text x="56" y="76" class="mono" font-size="13" letter-spacing="2.5" fill="#6b7684">VLESS REVERSE · XRAY-CORE 26 · REALITY</text>
    <text x="54" y="140" class="mono" font-size="56" font-weight="700" fill="#e8ecf1">xray-<tspan fill="#78ffb4">home</tspan>-exit</text>
  </g>
  <g class="in d1">
    <text x="56" y="188" class="sans" font-size="23" fill="#c3cad3">Sunucuna bağlan, ev internetinden çık.</text>
    <text x="56" y="218" class="sans" font-size="17" fill="#6b7684">Connect to your VPS, exit through your home internet.</text>
  </g>
  <g class="in d2 mono" font-size="13">
    <rect x="56" y="250" width="86" height="30" rx="15" fill="#12161b" stroke="#2a323c"/>
    <text x="99" y="270" text-anchor="middle" fill="#c3cad3">OpenWrt</text>
    <rect x="150" y="250" width="122" height="30" rx="15" fill="#12161b" stroke="#2a323c"/>
    <text x="211" y="270" text-anchor="middle" fill="#c3cad3">Raspberry Pi</text>
    <rect x="280" y="250" width="70" height="30" rx="15" fill="#12161b" stroke="#2a323c"/>
    <text x="315" y="270" text-anchor="middle" fill="#c3cad3">Linux</text>
    <rect x="358" y="250" width="88" height="30" rx="15" fill="#12161b" stroke="#2a323c"/>
    <text x="402" y="270" text-anchor="middle" fill="#c3cad3">Windows</text>
    <rect x="454" y="250" width="118" height="30" rx="15" fill="#12161b" stroke="#78ffb4" stroke-opacity=".5"/>
    <text x="513" y="270" text-anchor="middle" fill="#78ffb4">x-ui · 3x-ui</text>
  </g>

  <!-- sağ: mini akış -->
  <g class="in d3">
    <!-- istemci -->
    <rect x="752" y="62" width="34" height="58" rx="8" fill="#12161b" stroke="#c3cad3" stroke-width="2"/>
    <rect x="764" y="67" width="10" height="2.5" rx="1.25" fill="#5b6573"/>
    <text x="769" y="144" class="mono" font-size="11" text-anchor="middle" fill="#6b7684">client</text>

    <!-- istemci → sunucu -->
    <path id="p-in" d="M796 91H984" fill="none" stroke="#2a323c" stroke-width="2"/>
    <circle r="3.5" fill="#b69cff"><animateMotion dur="1.6s" repeatCount="indefinite" path="M796 91H984"/></circle>
    <circle r="3.5" fill="#b69cff" opacity=".6"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" path="M796 91H984"/></circle>

    <!-- sunucu -->
    <rect x="990" y="52" width="160" height="78" rx="12" fill="#12161b" stroke="#b69cff" stroke-width="2"/>
    <g stroke="#2a323c" stroke-width="2" stroke-linecap="round">
      <path d="M1006 74H1100M1006 91H1100M1006 108H1100"/>
    </g>
    <circle cx="1126" cy="74" r="3.5" fill="#b69cff" class="led"/>
    <circle cx="1126" cy="91" r="3.5" fill="#78ffb4" class="led" style="animation-delay:.5s"/>
    <circle cx="1126" cy="108" r="3.5" fill="#5b6573"/>
    <text x="1098" y="154" class="mono" font-size="12" text-anchor="middle" fill="#b69cff">VPS</text>
    <text x="1098" y="171" class="sans" font-size="11.5" text-anchor="middle" fill="#6b7684">sabit IP · static IP</text>

    <!-- ev -->
    <path d="M762 244 806 206 850 244" fill="none" stroke="#78ffb4" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="772" y="240" width="68" height="46" rx="4" fill="#12161b" stroke="#78ffb4" stroke-width="2.4"/>
    <rect x="799" y="262" width="14" height="24" rx="2" fill="none" stroke="#78ffb4" stroke-width="2"/>
    <text x="806" y="310" class="sans" font-size="11.5" text-anchor="middle" fill="#6b7684">ev IP · home IP</text>

    <!-- kalıcı tünel: evden sunucuya açılır, trafik sunucudan eve akar -->
    <path d="M852 236C940 236 1004 206 1012 132" fill="none" stroke="#78ffb4" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
    <path d="M852 236C940 236 1004 206 1012 132" fill="none" stroke="#78ffb4" stroke-opacity=".75" stroke-width="2" class="tunnel"/>
    <circle r="4" fill="#78ffb4"><animateMotion dur="1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M852 236C940 236 1004 206 1012 132"/></circle>
    <circle r="4" fill="#78ffb4" opacity=".55"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M852 236C940 236 1004 206 1012 132"/></circle>
    <text x="872" y="257" class="mono" font-size="11" fill="#78ffb4" opacity=".85">reverse tunnel</text>

    <!-- ev → internet -->
    <path d="M846 270H1052" fill="none" stroke="#2a323c" stroke-width="2"/>
    <circle r="3.5" fill="#78ffb4"><animateMotion dur="1.4s" repeatCount="indefinite" path="M846 270H1052"/></circle>
    <circle r="3.5" fill="#78ffb4" opacity=".55"><animateMotion dur="1.4s" begin=".7s" repeatCount="indefinite" path="M846 270H1052"/></circle>

    <!-- internet -->
    <g fill="none" stroke="#ffb86b" stroke-width="2">
      <circle cx="1084" cy="270" r="28"/>
      <ellipse cx="1084" cy="270" rx="12" ry="28"/>
      <path d="M1056 270H1112M1060 256H1108M1060 284H1108" stroke-opacity=".6"/>
    </g>
    <text x="1084" y="320" class="sans" font-size="11.5" text-anchor="middle" fill="#6b7684">internet</text>
  </g>
</svg>
